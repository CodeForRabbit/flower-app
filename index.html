<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>花名册</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="header">
  <h1>花名册</h1>
  <p>人间草木 · 各有所归</p>
</div>

<button id="editToggle" class="edit-toggle" type="button">编辑</button>

<div class="filters">
  <label class="filter-label" for="memberSelect">成员</label>
  <select id="memberSelect">
    <option value="">请选择成员</option>
  </select>

  <label class="filter-label" for="flowerSelect">花名</label>
  <select id="flowerSelect">
    <option value="">请选择花名</option>
  </select>

  <!-- 等级筛选后续再启用 -->
  <!--
  <select id="levelFilter">
    <option value="">全部品级</option>
    <option>凡品</option>
    <option>普通</option>
    <option>珍稀</option>
    <option>华品</option>
    <option>仙品</option>
  </select>
  -->

  <div class="actions">
    <button id="resetBtn" type="button">清空筛选</button>
  </div>
</div>

<div class="editor hidden" id="editorPanel">
  <h2>编辑成员</h2>
  <div class="editor-row">
    <label class="filter-label" for="editMemberSelect">选择成员</label>
    <select id="editMemberSelect">
      <option value="">新成员</option>
    </select>
  </div>

  <div class="editor-row">
    <label class="filter-label" for="editMemberName">成员名称</label>
    <input id="editMemberName" placeholder="请输入成员名称" />
  </div>

  <div class="editor-row">
    <label class="filter-label" for="editMemberFlowers">成员拥有的花</label>
    <div class="flower-editor">
      <div class="flower-picker">
        <div class="picker-title">从已有花名选择（点一下即添加）</div>
        <div id="flowerPickTags" class="pick-tags"></div>
      </div>
      <div class="flower-controls">
        <input id="flowerInput" placeholder="手动输入花名后回车" />
      </div>
      <div id="flowerTags" class="flower-tags"></div>
      <textarea id="editMemberFlowers" rows="3" placeholder="花名会自动汇总到这里"></textarea>
    </div>
  </div>

  <div class="actions">
    <button id="saveLocalBtn" type="button">保存到本页</button>
    <button id="deleteMemberBtn" type="button">删除成员</button>
  </div>

  <div class="editor-divider"></div>

  <h2>保存到 GitHub</h2>
  <p class="editor-tip">会直接更新仓库中的 data.json</p>
  <div class="editor-row">
    <label class="filter-label" for="githubToken">GitHub Token</label>
    <input id="githubToken" type="password" placeholder="粘贴你的 Token" />
  </div>
  <div class="actions">
    <button id="saveGithubBtn" type="button">保存到仓库</button>
  </div>
  <div id="saveStatus" class="editor-tip"></div>
</div>

<div id="result"></div>

<script src="app.js"></script>
</body>
</html>
