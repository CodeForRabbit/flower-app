<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>花名册</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="header">
  <h1>花名册</h1>
  <p>人间草木 · 各有所归</p>
</div>

<div class="filters">
  <label class="filter-label" for="memberSearch">成员</label>
  <input id="memberSearch" list="memberList" placeholder="选择成员或输入关键字" />
  <datalist id="memberList"></datalist>

  <label class="filter-label" for="flowerSearch">花名</label>
  <input id="flowerSearch" list="flowerList" placeholder="选择花名或输入关键字" />
  <datalist id="flowerList"></datalist>

  <!-- 等级筛选后续再启用 -->
  <!--
  <select id="levelFilter">
    <option value="">全部品级</option>
    <option>凡品</option>
    <option>普通</option>
    <option>珍稀</option>
    <option>华品</option>
    <option>仙品</option>
  </select>
  -->

  <div class="actions">
    <button id="resetBtn" type="button">清空筛选</button>
  </div>
</div>

<div id="result"></div>

<script src="app.js"></script>
</body>
</html>
